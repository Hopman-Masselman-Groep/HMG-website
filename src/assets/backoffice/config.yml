locale: 'nl'

backend:
  name: github
  repo: Hopman-Masselman-Groep/HMG-website
  branch: trunk

media_folder: "public/"
media_library:
  name: cloudinary
  config:
    cloud_name: upl
    api_key: 864199774737865
    default_transformations:
      - - q

# Please run "npx netlify-cms-proxy-server" for local backend
local_backend: true

logo_url: /favicon.svg

collections:
  - label: "Pages"
    name: "pages"
    folder: "src/pages"
    create: true
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - label: "NKP"
    name: "nkp"
    folder: "src/pages/NKP"
    create: true
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - label: "Navigation"
        name: "eleventyNavigation"
        widget: "object"
        fields:
          - label: "Naam"
            name: "key"
            widget: "string"
            required: false
            hint: "De naam die in de navigatie wordt weergegeven. Laat leeg om de pagina niet in de navigatie weer te geven."
          - label: "Order"
            name: "order"
            widget: "number"
            hint: "De volgorde van de pagina in de navigatie. Hoe lager het getal, hoe hoger de pagina in de navigatie staat."
            required: false
      - { label: "Body", name: "body", widget: "markdown" }